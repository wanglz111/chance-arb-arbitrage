<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chance Arb Candidate Viewer</title>
    <link rel="stylesheet" href="/styles.css?v=20260428b" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <h1>Chance Arb Viewer</h1>
        <div class="topbar-actions">
          <button id="refreshButton" class="button" type="button">Refresh</button>
          <label class="toggle">
            <input id="autoRefreshToggle" type="checkbox" />
            <span>Auto refresh 15s</span>
          </label>
        </div>
      </header>

      <section id="summaryGrid" hidden>
        <article>
          <span class="stat-label">Total</span>
          <strong class="stat-value" id="totalCandidates">-</strong>
        </article>
        <article>
          <span class="stat-label">Flash Loan</span>
          <strong class="stat-value" id="flashLoanCandidates">-</strong>
        </article>
        <article>
          <span class="stat-label">Payout</span>
          <strong class="stat-value" id="payoutCandidates">-</strong>
        </article>
        <article>
          <span class="stat-label">Avg Score</span>
          <strong class="stat-value" id="averageScore">-</strong>
        </article>
      </section>

      <section class="filters">
        <p id="datasetMeta" hidden>-</p>

        <form id="filterForm" class="filter-form">
          <label class="field field-search">
            <span>Search</span>
            <input id="searchInput" name="q" type="search" placeholder="tx hash / address / evidence / route hint" />
          </label>

          <label class="field">
            <span>Tag</span>
            <select id="tagSelect" name="tag">
              <option value="">All tags</option>
            </select>
          </label>

          <label class="field">
            <span>Protocol</span>
            <select id="protocolSelect" name="protocol">
              <option value="">All protocols</option>
            </select>
          </label>

          <label class="field">
            <span>Route Hint</span>
            <select id="routeHintSelect" name="routeHint">
              <option value="">All route hints</option>
            </select>
          </label>

          <label class="field field-short">
            <span>Sort</span>
            <select id="sortSelect" name="sort">
              <option value="newest">Newest</option>
              <option value="score-desc">Score desc</option>
              <option value="score-asc">Score asc</option>
              <option value="oldest">Oldest</option>
            </select>
          </label>

          <label class="field field-short">
            <span>Page Size</span>
            <select id="limitSelect" name="limit">
              <option value="25">25</option>
              <option value="50" selected>50</option>
              <option value="100">100</option>
            </select>
          </label>

          <label class="toggle">
            <input id="flashLoanOnly" name="flashLoanOnly" type="checkbox" />
            <span>Flash loan only</span>
          </label>

          <label class="toggle">
            <input id="payoutOnly" name="payoutOnly" type="checkbox" />
            <span>Payout only</span>
          </label>

          <label class="toggle quick-filter">
            <input id="scoreSevenNewest" name="scoreSevenNewest" type="checkbox" />
            <span>Score 7+ newest</span>
          </label>
        </form>

        <div id="tagChips" hidden></div>
        <div id="protocolChips" hidden></div>
      </section>

      <main class="results">
        <div class="results-head">
          <h2 id="resultsTitle">Candidates</h2>
          <div class="pager">
            <button id="prevButton" class="button" type="button">Prev</button>
            <span id="pageInfo">-</span>
            <button id="nextButton" class="button" type="button">Next</button>
          </div>
        </div>

        <div id="resultsMeta" class="results-meta" hidden>-</div>
        <div id="candidateList" class="candidate-list"></div>
      </main>
    </div>

    <template id="candidateTemplate">
      <article class="candidate-card">
        <div class="candidate-main">
          <strong class="candidate-tx"></strong>
          <div class="score-line"></div>
          <div class="candidate-subtitle"></div>
        </div>

        <div class="candidate-section">
          <span class="section-label">Tags</span>
          <div class="chip-row candidate-tags"></div>
        </div>

        <div class="candidate-section">
          <span class="section-label">Protocols</span>
          <div class="chip-row candidate-protocols"></div>
        </div>

        <div class="candidate-section route-hints-section">
          <span class="section-label">Route Hints</span>
          <div class="chip-row candidate-route-hints"></div>
        </div>

        <div class="candidate-actions">
          <a class="button link-button arbiscan-link" target="_blank" rel="noreferrer">Arbiscan</a>
          <a class="button link-button blocksec-link" target="_blank" rel="noreferrer">Blocksec Phalcon</a>
        </div>
      </article>
    </template>

    <script type="module" src="/app.js?v=20260428b"></script>
  </body>
</html>
