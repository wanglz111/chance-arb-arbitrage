services:
  scanner:
    image: ${CHANCE_ARB_IMAGE:-ghcr.io/wanglz111/chance-arb-arbitrage:latest}
    pull_policy: always
    container_name: chance-arb-scanner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OUTPUT_PATH: /app/data/candidates.jsonl
      CHECKPOINT_PATH: /app/data/checkpoints.json
    command: ["node", "dist/src/index.js"]
    volumes:
      - ./data:/app/data
    networks:
      - default

  viewer:
    image: ${CHANCE_ARB_IMAGE:-ghcr.io/wanglz111/chance-arb-arbitrage:latest}
    pull_policy: always
    container_name: chance-arb-viewer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CANDIDATES_PATH: /app/data/candidates.jsonl
      VIEWER_HOST: 0.0.0.0
      VIEWER_PORT: 4310
    command: ["node", "dist/scripts/view-candidates.js"]
    volumes:
      - ./data:/app/data:ro
    networks:
      - default
      - monitor_net

networks:
  monitor_net:
    external: true
